name: HeadRoom
options:
  bundleIdPrefix: com.amit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
targets:
  HeadRoom:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HeadRoom
      - path: Shared
    resources:
      - path: HeadRoom/Assets.xcassets
    info:
      path: HeadRoom/Info.plist
    entitlements:
      path: HeadRoom/HeadRoom.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amit.headroom
        PRODUCT_NAME: HeadRoom
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
          PROVISIONING_PROFILE_SPECIFIER: $(HEADROOM_APP_PROFILE_NAME)
    preBuildScripts:
      - name: Generate Head Room app icon
        script: |
          env -u SDKROOT xcrun --sdk macosx swift "$SRCROOT/Scripts/generate_icon.swift"
        basedOnDependencyAnalysis: false
    dependencies:
      - target: HeadRoomWidget
  HeadRoomWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HeadRoomWidget
      - path: Shared
    info:
      path: HeadRoomWidget/Info.plist
    entitlements:
      path: HeadRoomWidget/HeadRoomWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amit.headroom.widget
        PRODUCT_NAME: HeadRoomWidget
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
          PROVISIONING_PROFILE_SPECIFIER: $(HEADROOM_WIDGET_PROFILE_NAME)
schemes:
  HeadRoom:
    build:
      targets:
        HeadRoom: all
        HeadRoomWidget: all
    run:
      config: Debug
    archive:
      config: Release
