name: Build Head Room Signed IPA

on:
  workflow_dispatch:

jobs:
  build-signed-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate signing secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          IOS_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          missing=0
          for name in             APPLE_TEAM_ID             APPLE_DISTRIBUTION_CERTIFICATE_BASE64             APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD             IOS_APP_PROVISIONING_PROFILE_BASE64             IOS_WIDGET_PROVISIONING_PROFILE_BASE64             IOS_KEYCHAIN_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit $missing

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Apple distribution certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/headroom-signing.keychain-db"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH"             -P "$CERTIFICATE_PASSWORD"             -A             -t cert             -f pkcs12             -k "$KEYCHAIN_PATH"
          security set-key-partition-list             -S apple-tool:,apple:,codesign:             -s             -k "$KEYCHAIN_PASSWORD"             "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Install provisioning profiles
        env:
          APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          APP_PROFILE="$RUNNER_TEMP/headroom-app.mobileprovision"
          WIDGET_PROFILE="$RUNNER_TEMP/headroom-widget.mobileprovision"

          echo "$APP_PROFILE_BASE64" | base64 --decode > "$APP_PROFILE"
          echo "$WIDGET_PROFILE_BASE64" | base64 --decode > "$WIDGET_PROFILE"

          security cms -D -i "$APP_PROFILE" > "$RUNNER_TEMP/headroom-app.plist"
          security cms -D -i "$WIDGET_PROFILE" > "$RUNNER_TEMP/headroom-widget.plist"

          APP_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/headroom-app.plist")
          APP_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/headroom-app.plist")
          WIDGET_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/headroom-widget.plist")
          WIDGET_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/headroom-widget.plist")

          cp "$APP_PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$APP_UUID.mobileprovision"
          cp "$WIDGET_PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$WIDGET_UUID.mobileprovision"

          echo "HEADROOM_APP_PROFILE_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "HEADROOM_WIDGET_PROFILE_NAME=$WIDGET_NAME" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive Head Room
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild             -project ios/HeadRoom.xcodeproj             -scheme HeadRoom             -configuration Release             -destination "generic/platform=iOS"             -archivePath ios/build/HeadRoom.xcarchive             APPLE_TEAM_ID="$APPLE_TEAM_ID"             HEADROOM_APP_PROFILE_NAME="$HEADROOM_APP_PROFILE_NAME"             HEADROOM_WIDGET_PROFILE_NAME="$HEADROOM_WIDGET_PROFILE_NAME"             archive

      - name: Create export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.amit.headroom</key>
              <string>$HEADROOM_APP_PROFILE_NAME</string>
              <key>com.amit.headroom.widget</key>
              <string>$HEADROOM_WIDGET_PROFILE_NAME</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Export signed IPA
        run: |
          xcodebuild             -exportArchive             -archivePath ios/build/HeadRoom.xcarchive             -exportPath ios/export             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: HeadRoom-Signed-IPA
          path: ios/export/*.ipa
          if-no-files-found: error
