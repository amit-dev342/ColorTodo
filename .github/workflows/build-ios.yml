name: Build Head Room iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build Head Room for iOS Simulator
        run: |
          xcodebuild             -project ios/HeadRoom.xcodeproj             -scheme HeadRoom             -configuration Debug             -sdk iphonesimulator             -derivedDataPath ios/build             CODE_SIGNING_ALLOWED=NO             build

      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent             ios/build/Build/Products/Debug-iphonesimulator/HeadRoom.app             HeadRoom-iOS-Simulator.zip

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: HeadRoom-iOS-Simulator
          path: HeadRoom-iOS-Simulator.zip
